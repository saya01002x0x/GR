name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FRONTEND_DIR: frontend
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
  CLERK_SECRET_KEY: sk_test_dummy

jobs:
  frontend_build_and_static:
    name: Frontend Build & Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js & PNPM
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x
          working-directory: ${{ env.FRONTEND_DIR }}

      - name: Build shared packages
        run: pnpm --filter "@gr/*" build

      - name: Linter
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm run lint

      - name: Type checking
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm run check:types

      - name: Build Next.js
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Cache Next.js build output
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.FRONTEND_DIR }}/.next
          key: nextjs-build-22.x-${{ github.sha }}

  frontend_unit_tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [frontend_build_and_static] 
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x
          working-directory: ${{ env.FRONTEND_DIR }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.57.0
        with:
          args: sh -c "npm install -g pnpm && cd ${{ env.FRONTEND_DIR }} && pnpm run test -- --coverage"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend_build_and_test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./backend
        run: pnpm exec prisma generate

      - name: Run Linter
        working-directory: ./backend
        run: pnpm run lint

      - name: Run Build
        working-directory: ./backend
        run: pnpm run build

      - name: Run Tests
        working-directory: ./backend
        run: pnpm run test
        env:
          SENTRY_DISABLED: 'true'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/lumina_test'
