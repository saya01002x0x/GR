name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FRONTEND_DIR: frontend
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
  CLERK_SECRET_KEY: sk_test_dummy

jobs:
  build_and_static:
    name: Build & Checks (Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js & PNPM
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x
          working-directory: ${{ env.FRONTEND_DIR }}

      # --- BƯỚC QUAN TRỌNG: Build thư viện dùng chung trước ---
      - name: Build shared packages
        run: pnpm --filter "@gr/*" build

      - name: Linter
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm run lint

      - name: Type checking
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm run check:types

      - name: Build Next.js
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm run build
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'

      # Lưu Cache build để Unit Test dùng lại nếu cần
      - name: Cache Next.js build output
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.FRONTEND_DIR }}/.next
          key: nextjs-build-22.x-${{ github.sha }}

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build_and_static] 
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x
          working-directory: ${{ env.FRONTEND_DIR }}

      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.57.0
        with:
          args: sh -c "cd ${{ env.FRONTEND_DIR }} && pnpm run test -- --coverage"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

