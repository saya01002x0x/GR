# ============================================
# Nginx Reverse Proxy Configuration
# Cho Lumina Project (luminaaaa.studio)
# ============================================
# Kiến trúc:
#   Internet → Cloudflare → VPS:80 (Nginx)
#     ├── luminaaaa.studio       → frontend:3000
#     ├── api.luminaaaa.studio   → backend:5145
#     └── luminaaaa.studio/storage/* → minio:9000
# ============================================

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:5145;
}

upstream minio {
    server minio:9000;
}

# ============================================
# Server 1: Main Website (luminaaaa.studio)
# ============================================
server {
    listen 80;
    server_name luminaaaa.studio www.luminaaaa.studio;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "upgrade-insecure-requests";

    # Giới hạn kích thước upload (phù hợp với upload artwork)
    client_max_body_size 50M;

    # --- MinIO Storage Proxy ---
    # URL dạng: https://luminaaaa.studio/storage/gr-uploads/image.png
    # Nginx nhận ở port 80 → chuyển ngầm vào minio:9000 trong Docker network
    # => Không cần mở port 9000 ra Internet, an toàn tuyệt đối!
    location /storage/ {
        proxy_pass http://minio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache ảnh tĩnh 7 ngày (tăng tốc load)
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Frontend (Next.js) ---
    # Tất cả request còn lại → Next.js
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============================================
# Server 2: API Backend (api.luminaaaa.studio)
# ============================================
server {
    listen 80;
    server_name api.luminaaaa.studio;

    # Giới hạn kích thước upload
    client_max_body_size 50M;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout dài hơn cho API calls (upload, AI processing)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ============================================
# Fallback: Trả 444 nếu truy cập bằng IP trực tiếp
# (Chặn bot quét IP, buộc phải đi qua domain)
# ============================================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
