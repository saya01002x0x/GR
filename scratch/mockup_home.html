<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Trang Chủ - Khám Phá</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #FFFFFF;
            color: #333;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 32px;
            background-color: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #E52E5C;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .search-container {
            flex-grow: 1;
            max-width: 600px;
            margin: 0 32px;
        }

        .search-input {
            width: 100%;
            padding: 12px 24px;
            border-radius: 999px; /* Nút tìm kiếm bo góc tròn */
            border: 1px solid #E5E7EB;
            background-color: #F8F9FA;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: #E52E5C;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(229, 46, 92, 0.1);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-upload {
            background-color: #E52E5C;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px; /* Bo góc 8px theo chuẩn */
            font-weight: 600;
            cursor: pointer;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #E5E7EB;
        }

        /* Lưới đa chiều (Masonry Grid) */
        .masonry-container {
            padding: 24px 32px;
            max-width: 100%; /* Tận dụng tối đa chiều rộng màn hình */
            margin: 0 auto;
        }

        .masonry-grid {
            column-count: 4; /* Số cột */
            column-gap: 20px;
        }

        @media (max-width: 1200px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 600px) { .masonry-grid { column-count: 1; } }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #F3F4F6;
            position: relative;
            cursor: pointer;
        }

        .masonry-item img {
            width: 100%;
            display: block;
            border-radius: 12px;
            transition: transform 0.3s;
        }

        .masonry-item:hover img {
            transform: scale(1.02);
        }

        /* Overlay khi hover */
        .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .masonry-item:hover .item-overlay {
            opacity: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .item-author {
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="logo">Lumina</a>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Khám phá các tác phẩm nghệ thuật, họa sĩ...">
        </div>
        <div class="nav-actions">
            <button class="btn-upload">Đăng tải</button>
            <div class="avatar">
                <img src="https://ui-avatars.com/api/?name=User&background=random" style="width:100%; border-radius:50%">
            </div>
        </div>
    </nav>

    <!-- Nội dung chính (Masonry Grid) -->
    <main class="masonry-container">
        <div class="masonry-grid">
            <!-- Sinh ảnh mẫu ngẫu nhiên -->
            <script>
                const heights = [300, 450, 250, 400, 500, 350, 480, 280, 420, 320, 380, 460];
                const grid = document.querySelector('.masonry-grid');
                
                for(let i = 0; i < 12; i++) {
                    const height = heights[i];
                    const item = document.createElement('div');
                    item.className = 'masonry-item';
                    item.innerHTML = `
                        <img src="https://picsum.photos/400/${height}?random=${i}" alt="Artwork">
                        <div class="item-overlay">
                            <div class="item-title">Tác phẩm sáng tạo #${i+1}</div>
                            <div class="item-author">Bởi Họa sĩ ${i+1}</div>
                        </div>
                    `;
                    grid.appendChild(item);
                }
            </script>
        </div>
    </main>

</body>
</html>
